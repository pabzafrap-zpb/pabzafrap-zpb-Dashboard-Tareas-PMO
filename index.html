<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Tareas PMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #283548;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --color-completed: #10b981;
      --color-completed-bg: rgba(16, 185, 129, 0.12);
      --color-completed-border: #059669;

      --color-overdue: #ef4444;
      --color-overdue-bg: rgba(239, 68, 68, 0.12);
      --color-overdue-border: #dc2626;

      --color-in-progress: #3b82f6;
      --color-in-progress-bg: rgba(59, 130, 246, 0.12);
      --color-in-progress-border: #2563eb;

      --color-pending: #f59e0b;
      --color-pending-bg: rgba(245, 158, 11, 0.12);
      --color-pending-border: #d97706;

      --color-review: #ec4899;
      --color-review-bg: rgba(236, 72, 153, 0.14);
      --color-review-border: #db2777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-count {
      font-size: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .indicator-completed { background-color: var(--color-completed); box-shadow: 0 0 8px var(--color-completed); }
    .indicator-overdue { background-color: var(--color-overdue); box-shadow: 0 0 8px var(--color-overdue); }
    .indicator-review { background-color: var(--color-review); box-shadow: 0 0 8px var(--color-review); }
    .indicator-default { background-color: var(--color-in-progress); }

    /* Métricas */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      position: relative;
      overflow: hidden;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      color: #fff;
    }

    .metric-subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .metric-card.total { border-left: 4px solid var(--color-in-progress); }
    .metric-card.completed { border-left: 4px solid var(--color-completed); }
    .metric-card.completed .metric-value { color: #34d399; }
    .metric-card.overdue { border-left: 4px solid var(--color-overdue); }
    .metric-card.overdue .metric-value { color: #f87171; }
    .metric-card.review { border-left: 4px solid var(--color-review); }
    .metric-card.review .metric-value { color: #f472b6; }
    .metric-card.compliance { border-left: 4px solid #a855f7; }
    .metric-card.compliance .metric-value { color: #c084fc; }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 0.25rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9333ea, #34d399);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    /* Barra de filtros y herramientas */
    .controls-panel {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .filters-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .filter-item label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .custom-select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 1.8rem 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      background-size: 1rem;
      min-width: 170px;
      outline: none;
      transition: border-color 0.2s;
    }

    .custom-select:focus {
      border-color: #60a5fa;
    }

    .reset-btn {
      align-self: flex-end;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      height: 33px;
    }

    .reset-btn:hover {
      background: #334155;
      color: #fff;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-left: auto;
    }

    .file-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #334155;
      color: #fff;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #475569;
      transition: background 0.2s;
    }

    .file-btn:hover {
      background: #475569;
    }

    input[type="file"] {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--surface);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-left: 6px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
      background-color: var(--surface-hover);
    }

    /* Estado: Revisar */
    .card.status-review {
      border-left-color: var(--color-review);
      background: linear-gradient(135deg, var(--surface) 80%, var(--color-review-bg));
    }

    /* Estado: Cumplida -> Verde */
    .card.status-completed {
      border-left-color: var(--color-completed);
      background: linear-gradient(135deg, var(--surface) 80%, var(--color-completed-bg));
    }

    /* Estado: Vencida -> Rojo */
    .card.status-overdue {
      border-left-color: var(--color-overdue);
      background: linear-gradient(135deg, var(--surface) 80%, var(--color-overdue-bg));
    }

    /* Otros estados */
    .card.status-in-progress {
      border-left-color: var(--color-in-progress);
    }

    .card.status-pending {
      border-left-color: var(--color-pending);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      color: #fff;
    }

    .card-title.placeholder {
      color: #94a3b8;
      font-style: italic;
    }

    .review-alert {
      background: rgba(236, 72, 153, 0.12);
      border: 1px solid rgba(236, 72, 153, 0.3);
      color: #f472b6;
      font-size: 0.75rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 0.85rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tag-review {
      background-color: var(--color-review-bg);
      color: #f472b6;
      border: 1px solid var(--color-review-border);
      font-weight: 600;
    }

    .tag-completed {
      background-color: var(--color-completed-bg);
      color: #34d399;
      border: 1px solid var(--color-completed-border);
    }

    .tag-overdue {
      background-color: var(--color-overdue-bg);
      color: #f87171;
      border: 1px solid var(--color-overdue-border);
    }

    .tag-in-progress {
      background-color: var(--color-in-progress-bg);
      color: #60a5fa;
      border: 1px solid var(--color-in-progress-border);
    }

    .tag-pending {
      background-color: var(--color-pending-bg);
      color: #fbbf24;
      border: 1px solid var(--color-pending-border);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #cbd5e1;
    }

    .avatar-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #fff;
    }

    .due-date {
      font-variant-numeric: tabular-nums;
    }

    .due-date.text-overdue {
      color: #f87171;
      font-weight: 600;
    }

    .due-date.text-invalid {
      color: #f472b6;
      font-weight: 600;
    }
  </style>
</head>

  <script>
    let allTasks = [];

    /**
     * Valida y formatea estrictamente una fecha en formato dd/mm/aaaa
     * Retorna objeto Date si es válida, o null si el formato o los valores del calendario son incorrectos.
     */
    function parseStrictDate(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return null;
      const trimmed = dateStr.trim();
      
      // Debe cumplir estrictamente formato dd/mm/aaaa (2 dígitos día, 2 dígitos mes, 4 dígitos año)
      const regex = /^(\d{2})\/(\d{2})\/(\d{4})$/;
      const match = trimmed.match(regex);
      if (!match) return null;

      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10);
      const year = parseInt(match[3], 10);

      if (month < 1 || month > 12) return null;
      if (day < 1 || day > 31) return null;
      if (year < 1900 || year > 2100) return null;

      const dateObj = new Date(year, month - 1, day);
      if (dateObj.getFullYear() !== year || 
          dateObj.getMonth() !== month - 1 || 
          dateObj.getDate() !== day) {
        return null; // Caso de fechas como 31/02/2026
      }

      return dateObj;
    }

    /**
     * Parsea CSV y descarta registros completamente vacíos (sin ningún campo completado)
     */
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length < 2) return [];

      const headers = parseCSVLine(lines[0]);
      const results = [];

      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        
        // 1. Descartar registros que no tienen NINGÚN campo completado
        const hasAnyContent = values.some(val => val.trim() !== '');
        if (!hasAnyContent) {
          continue;
        }

        const item = {};
        headers.forEach((header, idx) => {
          const key = header.trim();
          item[key] = values[idx] ? values[idx].trim() : '';
        });

        // 2. Evaluar criterios de "Revisar":
        // - Hay un registro con tarea, responsable, estado o fecha vacío
        // - La fecha informada no está en formato dd/mm/aaaa o es incorrecta
        const parsedDate = parseStrictDate(item.Fecha);
        const hasEmptyFields = !item.Tarea || !item.Responsable || !item.Estado || !item.Fecha;
        const isDateInvalid = !parsedDate;

        const needsReview = hasEmptyFields || isDateInvalid;

        const reasons = [];
        if (!item.Tarea) reasons.push('Tarea vacía');
        if (!item.Responsable) reasons.push('Responsable sin asignar');
        if (!item.Estado) reasons.push('Estado no informado');
        if (!item.Fecha) reasons.push('Fecha vacía');
        else if (isDateInvalid) reasons.push('Fecha no válida (requiere dd/mm/aaaa)');

        item._parsedDate = parsedDate;
        item._needsReview = needsReview;
        item._reviewReason = reasons.join(', ');

        results.push(item);
      }
      return results;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"' && (i === 0 || line[i - 1] !== '\\')) {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current);
      return result;
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(' ')
        .map(n => n[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    function isTaskCompleted(task) {
      const estado = (task.Estado || '').trim().toLowerCase();
      return ['completada', 'completado', 'cumplida', 'cumplido', 'finalizada', 'hecho'].includes(estado);
    }

    function isTaskOverdue(task, today) {
      if (isTaskCompleted(task)) return false;
      return !!(task._parsedDate && task._parsedDate < today);
    }

    function updateMetrics(tasks, today) {
      const total = tasks.length;
      let completed = 0;
      let overdue = 0;
      let review = 0;

      tasks.forEach(task => {
        if (task._needsReview) {
          review++;
        }
        if (isTaskCompleted(task)) {
          completed++;
        } else if (isTaskOverdue(task, today)) {
          overdue++;
        }
      });

      const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

      document.getElementById('metric-total').textContent = total;
      document.getElementById('metric-completed').textContent = completed;
      document.getElementById('metric-overdue').textContent = overdue;
      document.getElementById('metric-review').textContent = review;
      document.getElementById('metric-percentage').textContent = `${percentage}%`;
      document.getElementById('metric-progress-fill').style.width = `${percentage}%`;
    }

    function populateFilterOptions(tasks) {
      const responsibleSelect = document.getElementById('filter-responsible');
      const statusSelect = document.getElementById('filter-status');

      const currentResp = responsibleSelect.value;
      const currentStatus = statusSelect.value;

      const responsibles = [...new Set(tasks.map(t => t.Responsable).filter(Boolean))].sort();
      const rawStatuses = [...new Set(tasks.map(t => t.Estado).filter(Boolean))].sort();

      responsibleSelect.innerHTML = '<option value="">Todos los responsables</option>' +
        responsibles.map(r => `<option value="${escapeHTML(r)}" ${r === currentResp ? 'selected' : ''}>${escapeHTML(r)}</option>`).join('');

      // Incluye la opción "Revisar" al principio de los estados
      let statusOptions = '<option value="">Todos los estados</option>';
      statusOptions += `<option value="Revisar" ${currentStatus === 'Revisar' ? 'selected' : ''}>⚠️ Revisar</option>`;

      rawStatuses.forEach(s => {
        statusOptions += `<option value="${escapeHTML(s)}" ${s === currentStatus ? 'selected' : ''}>${escapeHTML(s)}</option>`;
      });

      statusSelect.innerHTML = statusOptions;
    }

    function filterAndRender() {
      const selectedResp = document.getElementById('filter-responsible').value;
      const selectedStatus = document.getElementById('filter-status').value;

      const filteredTasks = allTasks.filter(task => {
        const matchesResp = !selectedResp || task.Responsable === selectedResp;

        let matchesStatus = true;
        if (selectedStatus === 'Revisar') {
          matchesStatus = task._needsReview;
        } else if (selectedStatus) {
          matchesStatus = task.Estado === selectedStatus;
        }

        return matchesResp && matchesStatus;
      });

      renderCards(filteredTasks);
    }

    function renderCards(tasks) {
      const container = document.getElementById('cards-container');
      const countEl = document.getElementById('task-count');
      countEl.textContent = `${tasks.length} ${tasks.length === 1 ? 'tarea' : 'tareas'}`;

      if (tasks.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem 1rem;">
            No se encontraron tareas que coincidan con los filtros seleccionados.
          </div>
        `;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      container.innerHTML = tasks.map(task => {
        const estadoNorm = (task.Estado || '').trim().toLowerCase();
        const completed = isTaskCompleted(task);
        const overdue = isTaskOverdue(task, today);
        const isRetrasada = estadoNorm === 'retrasada' || estadoNorm === 'vencida';
        const needsReview = task._needsReview;

        let statusClass = 'status-in-progress';
        let tagClass = 'tag-in-progress';
        let statusLabel = task.Estado || 'Sin estado';

        if (needsReview) {
          statusClass = 'status-review';
          tagClass = 'tag-review';
          statusLabel = 'Revisar';
        } else if (completed) {
          statusClass = 'status-completed';
          tagClass = 'tag-completed';
        } else if (overdue || isRetrasada) {
          statusClass = 'status-overdue';
          tagClass = 'tag-overdue';
          if (!isRetrasada && overdue) {
            statusLabel = `${task.Estado} (Vencida)`;
          }
        } else if (estadoNorm === 'pendiente') {
          statusClass = 'status-pending';
          tagClass = 'tag-pending';
        }

        const initials = getInitials(task.Responsable);
        const taskTitle = task.Tarea ? escapeHTML(task.Tarea) : '<span class="card-title placeholder">Tarea no especificada</span>';
        const respLabel = task.Responsable ? escapeHTML(task.Responsable) : '<em style="color:#f472b6;">Sin asignar</em>';
        
        let dateDisplay = escapeHTML(task.Fecha || 'Sin fecha');
        let dateClass = '';
        if (!task.Fecha || !task._parsedDate) {
          dateClass = 'text-invalid';
          dateDisplay = task.Fecha ? `⚠️ ${escapeHTML(task.Fecha)} (inválida)` : '⚠️ Sin fecha';
        } else if (overdue || isRetrasada) {
          dateClass = 'text-overdue';
          dateDisplay = `📅 ${escapeHTML(task.Fecha)}`;
        } else {
          dateDisplay = `📅 ${escapeHTML(task.Fecha)}`;
        }

        return `
          <article class="card ${statusClass}">
            <div>
              <h2 class="card-title">${taskTitle}</h2>
              ${needsReview ? `
                <div class="review-alert">
                  <span>⚠️ ${escapeHTML(task._reviewReason)}</span>
                </div>
              ` : ''}
            </div>
            <div class="card-meta">
              <div class="meta-row">
                <span class="user-pill">
                  <span class="avatar-icon">${initials}</span>
                  <span>${respLabel}</span>
                </span>
                <span class="tag ${tagClass}">${escapeHTML(statusLabel)}</span>
              </div>
              <div class="meta-row">
                <span>Fecha límite:</span>
                <span class="due-date ${dateClass}">
                  ${dateDisplay}
                </span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function initData(tasks) {
      allTasks = tasks;
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      updateMetrics(allTasks, today);
      populateFilterOptions(allTasks);
      filterAndRender();
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadTasks() {
      if (window.location.protocol === 'file:') {
        const rawCSV = document.getElementById('pmo-csv-data').textContent;
        initData(parseCSV(rawCSV));
        return;
      }

      // Carga con ruta relativa compatible con Vercel y servidores web estáticos
      // Se intenta cargar './tareas_pmo.csv' y si no './tareas_pmo_anonimas.csv'
      const candidates = ['./tareas_pmo.csv', './tareas_pmo_anonimas.csv'];
      for (const path of candidates) {
        try {
          const response = await fetch(path);
          if (response.ok) {
            const text = await response.text();
            initData(parseCSV(text));
            return;
          }
        } catch {
          // continuar con el siguiente candidato
        }
      }

      // Si falla la red, usar los datos incrustados de respaldo
      const rawCSV = document.getElementById('pmo-csv-data').textContent;
      initData(parseCSV(rawCSV));
    }

    // Listeners de los filtros combinables
    document.getElementById('filter-responsible').addEventListener('change', filterAndRender);
    document.getElementById('filter-status').addEventListener('change', filterAndRender);

    document.getElementById('btn-reset-filters').addEventListener('click', () => {
      document.getElementById('filter-responsible').value = '';
      document.getElementById('filter-status').value = '';
      filterAndRender();
    });

    // Carga de archivo CSV local adicional
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        initData(parseCSV(evt.target.result));
      };
      reader.readAsText(file);
    });

    loadTasks();
  </script>
</body>
</html>
